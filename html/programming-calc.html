<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProgrammingCalculator</title>
    <link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1">
    <link rel="stylesheet" crossorigin="anonymous" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css" integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ">
    <link rel="icon" href="../icon/calculator.png">
    <link rel="stylesheet" href="../css/user-profile.css">
    <link rel="stylesheet" href="../css/calc.css">

    <!-- jQuery CDN - Slim version (=without AJAX) -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>

    <!-- Bootstrap JS -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.0/js/bootstrap.min.js" integrity="sha384-uefMccjFJAIv6A+rW+L4AHf99KvxDjWSu1z9VI8SKNVmz4sk7buKt/6v9KI65qnm" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.7/dist/umd/popper.min.js" integrity="sha384-..." crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-..." crossorigin="anonymous"></script>

    <!-- Bootstrap CSS CDN -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.0/css/bootstrap.min.css" integrity="sha384-9gVQ4dYFwwWSjIDZnLEWnxCjeSWFphJiwGPXr1jddIhOegiu1FwO5qRGvFXOdJZ4" crossorigin="anonymous">
</head>

<body>
    <div class="pos-f-t">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid d-flex justify-content-between align-items-center">
                <a href="../html/index.html" class="navbar-brand">
                    <img src="../icon/calculator.png" width="60" height="60" alt="Logo">
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="navbar-nav nav-link me-right" aria-current="page" href="../html/ordinary-calc.html">Ordinary</a>
                        </li>
                    </ul>

                    <div class="d-flex align-items-center gap-3">
                        <a href="../html/log-in.html" class="btn btn-login">Log In</a>
                        <a href="../html/user-profile.html">
                            <img src="../icon/user-photo.png" width="40" height="40" alt="User" class="rounded-circle">
                        </a>
                    </div>

                </div>
            </nav>

            <div class="container-fluid">
                <ul class="list-group border border-2 border-dark border-top-0 rounded-0">
                    <li class="list-group-item d-flex justify-content-between align-items-center px-3 py-3">
                        <span class="fw-bold">Expression:</span>
                        <span class="text-muted h5 mb-0">(5 + 7) ÷ 4 =</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center px-3 py-3">
                        <span class="fw-bold">Result:</span>
                        <span class="h2 mb-0">3</span>
                    </li>
                </ul>
            </div>

            <div class="container-fluid" style="height: 75vh;">
                <div class="row gx-1 gy-1 mb-2 h-30">
                    <div class="col-4">
                        <div class="dropdown w-100 h-100">
                            <button type="button" class="btn btn-dark w-100 h-100 shadow-none border border-2 border-light rounded-0" data-bs-toggle="dropdown" aria-expanded="false">
                                Bitwise
                            </button>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item text-uppercase" href="#">And</a></li>
                                <li><a class="dropdown-item text-uppercase" href="#">Or</a></li>
                                <li><a class="dropdown-item text-uppercase" href="#">Not</a></li>
                                <li><a class="dropdown-item text-uppercase" href="#">Nand</a></li>
                                <li><a class="dropdown-item text-uppercase" href="#">Nor</a></li>
                                <li><a class="dropdown-item text-uppercase" href="#">Xor</a></li>
                            </ul>
                        </div>
                    </div>

                    <div class="col-4">
                        <div class="dropdown w-100 h-100">
                            <button type="button" class="btn btn-dark w-100 h-100 shadow-none border border-2 border-light rounded-0" data-bs-toggle="dropdown" aria-expanded="false">
                                Bit Shift
                            </button>
                            <ul class="dropdown-menu p-1">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="bitShift" checked />
                                    <label class="form-check-label text-capitalize">Arithmetic shift</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="bitShift" />
                                    <label class="form-check-label text-capitalize">Logical shift</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="bitShift" />
                                    <label class="form-check-label text-capitalize">Rotate circular shift</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="bitShift" />
                                    <label class="form-check-label text-capitalize">Rotate through carry circular shift</label>
                                </div>
                            </ul>
                        </div>
                    </div>

                    <div class="col-4">
                        <div class="dropdown w-100 h-100">
                            <button type="button" class="btn btn-dark w-100 h-100 shadow-none border border-2 border-light rounded-0" data-bs-toggle="dropdown" aria-expanded="false">
                                Base
                            </button>
                            <ul class="dropdown-menu p-1">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="baseSelect" checked />
                                    <label class="form-check-label text-capitalize">2</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="baseSelect" />
                                    <label class="form-check-label text-capitalize">8</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="baseSelect" />
                                    <label class="form-check-label text-capitalize">10</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="baseSelect" />
                                    <label class="form-check-label text-capitalize">16</label>
                                </div>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="row gx-1 gy-1 h-100">
                    <div class="col-2 d-flex flex-column gap-1 h-100">
                        <button class="btn btn-dark w-100 flex-fill">A</button>
                        <button class="btn btn-dark w-100 flex-fill">B</button>
                        <button class="btn btn-dark w-100 flex-fill">C</button>
                        <button class="btn btn-dark w-100 flex-fill">D</button>
                        <button class="btn btn-dark w-100 flex-fill">E</button>
                        <button class="btn btn-dark w-100 flex-fill">F</button>
                    </div>

                    <div class="col-10 d-flex flex-column h-100">
                        <div class="d-grid gap-1 flex-fill" style="grid-template-columns: repeat(4, 1fr);">
                            <button class="btn btn-dark w-100 h-100">&lt;&lt;</button>
                            <button class="btn btn-dark w-100 h-100">&gt;&gt;</button>
                            <button class="btn btn-dark w-100 h-100">C</button>
                            <button class="btn btn-dark w-100 h-100">⌫</button>

                            <button class="btn btn-dark w-100 h-100">(</button>
                            <button class="btn btn-dark w-100 h-100">)</button>
                            <button class="btn btn-dark w-100 h-100">%</button>
                            <button class="btn btn-dark w-100 h-100">÷</button>

                            <button class="btn btn-secondary w-100 h-100">7</button>
                            <button class="btn btn-secondary w-100 h-100">8</button>
                            <button class="btn btn-secondary w-100 h-100">9</button>
                            <button class="btn btn-dark w-100 h-100">×</button>

                            <button class="btn btn-secondary w-100 h-100">4</button>
                            <button class="btn btn-secondary w-100 h-100">5</button>
                            <button class="btn btn-secondary w-100 h-100">6</button>
                            <button class="btn btn-dark w-100 h-100">−</button>

                            <button class="btn btn-secondary w-100 h-100">1</button>
                            <button class="btn btn-secondary w-100 h-100">2</button>
                            <button class="btn btn-secondary w-100 h-100">3</button>
                            <button class="btn btn-dark w-100 h-100">+</button>

                            <button class="btn btn-secondary w-100 h-100">±</button>
                            <button class="btn btn-secondary w-100 h-100">0</button>
                            <button class="btn btn-secondary w-100 h-100">.</button>
                            <button class="btn btn-about w-100 h-100">=</button>
                        </div>
                    </div>
                </div>
            </div>
        </body>
</html>

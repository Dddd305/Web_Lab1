<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrdinaryCalculator</title>

    <link rel="stylesheet" crossorigin="anonymous"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css"
      integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1">
    <link rel="stylesheet" crossorigin="anonymous"
      href="https://use.fontawesome.com/releases/v5.7.0/css/all.css"
      integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ">
    <link rel="icon" href="../icon/calculator.png">
    <link rel="stylesheet" href="../css/user-profile.css">
    <link rel="stylesheet" href="../css/calc.css">

    <!-- jQuery CDN - Slim version (=without AJAX) -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
      integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
      crossorigin="anonymous"></script>
    <!-- Bootstrap JS -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.0/js/bootstrap.min.js"
      integrity="sha384-uefMccjFJAIv6A+rW+L4AHf99KvxDjWSu1z9VI8SKNVmz4sk7buKt/6v9KI65qnm"
      crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.7/dist/umd/popper.min.js"
      integrity="sha384-..." crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
      integrity="sha384-..." crossorigin="anonymous"></script>
    <!-- Bootstrap CSS CDN -->
    <link rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.0/css/bootstrap.min.css"
      integrity="sha384-9gVQ4dYFwwWSjIDZnLEWnxCjeSWFphJiwGPXr1jddIhOegiu1FwO5qRGvFXOdJZ4"
      crossorigin="anonymous">
  </head>

  <body>
    <div class="pos-f-t">
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid d-flex justify-content-between align-items-center">
          <a href="../html/index.html" class="navbar-brand">
            <img src="../icon/calculator.png" width="60" height="60" alt="Logo">
          </a>

          <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="navbar-nav nav-link me-right"
                  aria-current="page"
                  href="../html/programming-calc.html">
                  Programming
                </a>
              </li>
            </ul>

            <div class="d-flex align-items-center gap-3">
              <a href="../html/log-in.html" class="btn btn-login">Log In</a>
              <a href="../html/user-profile.html">
                <img src="../icon/user-photo.png" width="40" height="40" alt="User" class="rounded-circle">
              </a>
            </div>
          </div>
        </div>
      </nav>
    </div>

    <div class="container-fluid">
      <ul class="list-group border border-2 border-dark border-top-0 rounded-0">
        <li class="list-group-item d-flex justify-content-between align-items-center px-3 py-3">
          <span class="fw-bold">Expression:</span>
          <span class="text-muted h5 mb-0">(5 + 7) ÷ 4 =</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center px-3 py-3">
          <span class="fw-bold">Result:</span>
          <span class="h2 mb-0">3</span>
        </li>
      </ul>
    </div>

    <div class="container-fluid" style="height: 75vh;">
      <div class="row gx-1 gy-1 h-100">
        <div class="col-3">
          <button class="btn btn-dark w-100 h-100">%</button>
        </div>
        <div class="col-3">
          <button class="btn btn-dark w-100 h-100">CE</button>
        </div>
        <div class="col-3">
          <button class="btn btn-dark w-100 h-100">C</button>
        </div>
        <div class="col-3">
          <button class="btn btn-dark w-100 h-100">⌫</button>
        </div>

        <div class="col-3">
          <button class="btn btn-dark w-100 h-100">1/x</button>
        </div>
        <div class="col-3">
          <button class="btn btn-dark w-100 h-100">x²</button>
        </div>
        <div class="col-3">
          <button class="btn btn-dark w-100 h-100">√x</button>
        </div>
        <div class="col-3">
          <button class="btn btn-dark w-100 h-100">÷</button>
        </div>

        <div class="col-3">
          <button class="btn btn-secondary w-100 h-100">7</button>
        </div>
        <div class="col-3">
          <button class="btn btn-secondary w-100 h-100">8</button>
        </div>
        <div class="col-3">
          <button class="btn btn-secondary w-100 h-100">9</button>
        </div>
        <div class="col-3">
          <button class="btn btn-dark w-100 h-100">×</button>
        </div>

        <div class="col-3">
          <button class="btn btn-secondary w-100 h-100">4</button>
        </div>
        <div class="col-3">
          <button class="btn btn-secondary w-100 h-100">5</button>
        </div>
        <div class="col-3">
          <button class="btn btn-secondary w-100 h-100">6</button>
        </div>
        <div class="col-3">
          <button class="btn btn-dark w-100 h-100">−</button>
        </div>

        <div class="col-3">
          <button class="btn btn-secondary w-100 h-100">1</button>
        </div>
        <div class="col-3">
          <button class="btn btn-secondary w-100 h-100">2</button>
        </div>
        <div class="col-3">
          <button class="btn btn-secondary w-100 h-100">3</button>
        </div>
        <div class="col-3">
          <button class="btn btn-dark w-100 h-100">+</button>
        </div>

        <div class="col-3">
          <button class="btn btn-secondary w-100 h-100">±</button>
        </div>
        <div class="col-3">
          <button class="btn btn-secondary w-100 h-100">0</button>
        </div>
        <div class="col-3">
          <button class="btn btn-secondary w-100 h-100">.</button>
        </div>
        <div class="col-3">
          <button class="btn btn-about w-100 h-100">=</button>
        </div>
      </div>
    </div>
  </body>
</html>
